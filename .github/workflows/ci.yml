name: CI

on:
  push:
    branches: [main]
  pull_request:

# No production secrets are used anywhere in this workflow. All credentials below are
# throw-away values for the ephemeral Postgres service container.
env:
  PGUSER: saree
  PGPASSWORD: saree_ci_pw

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: saree
          POSTGRES_PASSWORD: saree_ci_pw
          POSTGRES_DB: saree_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U saree" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://saree:saree_ci_pw@localhost:5432/saree_test
      DATABASE_URL: postgresql+psycopg://saree:saree_ci_pw@localhost:5432/saree_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - name: Migration drift check
        run: alembic upgrade head && alembic check
      - run: pytest --cov=app --cov-report=term-missing
      - run: docker build -t vaigai-malli-api:ci .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The build tolerates an unreachable API (sitemap falls back to static routes).
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: saree
          POSTGRES_PASSWORD: saree_ci_pw
          POSTGRES_DB: saree_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U saree" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql+psycopg://saree:saree_ci_pw@localhost:5432/saree_e2e
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Backend venv
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
